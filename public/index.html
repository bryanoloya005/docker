<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker + Supabase Product CRUD</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; max-width: 850px; margin: 40px auto; padding: 0 18px; color: #243047; background: #f4f7fb; }
    h1 { color: #174a7e; }
    .panel { background: white; padding: 22px; border-radius: 12px; box-shadow: 0 3px 14px #17324d12; margin: 18px 0; }
    form { display: flex; flex-wrap: wrap; gap: 10px; }
    input { padding: 11px; border: 1px solid #cbd5e1; border-radius: 7px; flex: 1; min-width: 150px; }
    button { border: 0; border-radius: 7px; padding: 10px 14px; cursor: pointer; background: #1769aa; color: white; }
    button.delete { background: #b42318; }
    button.edit { background: #64748b; }
    .product { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #e5eaf0; }
    .actions { display: flex; gap: 7px; }
    #message { color: #b42318; min-height: 22px; }
    small { color: #64748b; }
  </style>
</head>
<body>
  <h1>Product Management</h1>
  <p>Express + Supabase + Docker demonstration</p>

  <section class="panel">
    <h2 id="formTitle">Add Product</h2>
    <form id="productForm">
      <input id="name" placeholder="Product name" required>
      <input id="price" type="number" min="0" step="0.01" placeholder="Price" required>
      <button type="submit" id="saveButton">Add Product</button>
      <button type="button" id="cancelButton" class="edit" hidden>Cancel</button>
    </form>
    <p id="message" role="status"></p>
  </section>

  <section class="panel">
    <h2>Products</h2>
    <div id="products">Loading products...</div>
    <small>Data is stored in your Supabase database.</small>
  </section>

  <script>
    const form = document.getElementById("productForm");
    const nameInput = document.getElementById("name");
    const priceInput = document.getElementById("price");
    const productsDiv = document.getElementById("products");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("saveButton");
    const cancelButton = document.getElementById("cancelButton");
    let editingId = null;

    async function request(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: { "Content-Type": "application/json", ...(options.headers || {}) }
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || "Request failed");
      return result;
    }

    async function loadProducts() {
      try {
        const products = await request("/api/products");
        productsDiv.replaceChildren();
        if (!products.length) {
          productsDiv.textContent = "No products yet. Add your first product above.";
          return;
        }

        products.forEach(product => {
          const row = document.createElement("div");
          row.className = "product";

          const details = document.createElement("span");
          details.textContent = `${product.name} — ₱${Number(product.price).toFixed(2)}`;

          const actions = document.createElement("div");
          actions.className = "actions";

          const edit = document.createElement("button");
          edit.className = "edit";
          edit.textContent = "Edit";
          edit.addEventListener("click", () => {
            editingId = product.id;
            nameInput.value = product.name;
            priceInput.value = product.price;
            document.getElementById("formTitle").textContent = "Edit Product";
            saveButton.textContent = "Save Changes";
            cancelButton.hidden = false;
            nameInput.focus();
          });

          const remove = document.createElement("button");
          remove.className = "delete";
          remove.textContent = "Delete";
          remove.addEventListener("click", async () => {
            if (!confirm(`Delete ${product.name}?`)) return;
            try {
              await request(`/api/products/${product.id}`, { method: "DELETE" });
              await loadProducts();
              message.textContent = "Product deleted.";
            } catch (error) { message.textContent = error.message; }
          });

          actions.append(edit, remove);
          row.append(details, actions);
          productsDiv.append(row);
        });
      } catch (error) {
        productsDiv.textContent = error.message;
      }
    }

    function resetForm() {
      editingId = null;
      form.reset();
      document.getElementById("formTitle").textContent = "Add Product";
      saveButton.textContent = "Add Product";
      cancelButton.hidden = true;
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      message.textContent = "";
      const payload = { name: nameInput.value, price: Number(priceInput.value) };
      try {
        if (editingId) {
          await request(`/api/products/${editingId}`, {
            method: "PUT", body: JSON.stringify(payload)
          });
          message.textContent = "Product updated.";
        } else {
          await request("/api/products", {
            method: "POST", body: JSON.stringify(payload)
          });
          message.textContent = "Product added.";
        }
        resetForm();
        await loadProducts();
      } catch (error) { message.textContent = error.message; }
    });

    cancelButton.addEventListener("click", resetForm);
    loadProducts();
  </script>
</body>
</html>
